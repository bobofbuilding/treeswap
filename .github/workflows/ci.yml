name: security-and-build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run vercel-build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge test

  lightning-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - run: bash -n infra/regtest/lab.sh
      - run: node --check infra/lightning-adapter/server.mjs
      - run: node --check infra/lightning-adapter/client.mjs
      - run: docker build --file infra/lightning-adapter/Dockerfile --tag treeswap/lightning-adapter:${{ github.sha }} .

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - run: npm ci --ignore-scripts
      - run: npm audit --prefix infra/coordinator/runtime --omit=dev --audit-level=moderate
      - run: node --check lib/coordinator-store.mjs
      - run: node --check lib/coordinator-action-runner.mjs
      - run: node --check lib/evm-action-runner.mjs
      - run: node --check lib/deployment-observer.mjs
      - run: node --check lib/deployment-policy.mjs
      - run: node --check lib/deployment-manifest-promotion.mjs
      - run: node --check lib/closed-testnet-deployment-files.mjs
      - run: node --check lib/closed-testnet-deployment-plan.mjs
      - run: node --check lib/closed-testnet-deployment-preflight-observer.mjs
      - run: node --check lib/closed-testnet-deployment-preflight.mjs
      - run: node --check lib/qualification-evidence.mjs
      - run: node --check lib/release-authorization.mjs
      - run: node --check lib/public-testnet-campaign-workflow.mjs
      - run: node --check lib/public-testnet-evidence.mjs
      - run: node --check lib/solver-capability.mjs
      - run: node --check lib/solver-endpoint-transport.mjs
      - run: node --check lib/solver-capacity-readers.mjs
      - run: node --check lib/lightning-capacity-protocol.mjs
      - run: node --check lib/solver-daemon-planner.mjs
      - run: node --check lib/solver-daemon-runtime.mjs
      - run: node --check lib/solver-private-packet.mjs
      - run: node --check lib/safety-monitor.mjs
      - run: node --check lib/cross-chain-deadline-evidence.mjs
      - run: node --check lib/live-bit-cross-chain-deadline-evidence.mjs
      - run: node --check infra/coordinator/smoke.mjs
      - run: node --check infra/coordinator/invoice-smoke.mjs
      - run: node --check infra/coordinator/disk-full-smoke.mjs
      - run: node --check infra/evm/escrow-reorg-smoke.mjs
      - run: node --check infra/evm/outbox-fault-smoke.mjs
      - run: node --check infra/evm/safety-monitor-smoke.mjs
      - run: node --check infra/evm/deployment-rehearsal-smoke.mjs
      - run: node --check infra/evm/cross-chain-deadline-smoke.mjs
      - run: bash -n scripts/run-evm-outbox-fault-smoke.sh
      - run: bash -n scripts/run-safety-monitor-smoke.sh
      - run: bash -n scripts/run-deployment-rehearsal-smoke.sh
      - run: bash -n scripts/run-live-bit-reorg-smoke.sh
      - run: bash -n scripts/run-cross-chain-deadline-smoke.sh
      - run: bash -n scripts/run-live-bit-cross-chain-deadline-smoke.sh
      - run: node --check scripts/run-local-qualification.mjs
      - run: node --check scripts/prepare-closed-testnet-deployment.mjs
      - run: node --check scripts/verify-closed-testnet-deployment.mjs
      - run: node --check scripts/observe-closed-testnet-deployment-preflight.mjs
      - run: node --check scripts/prepare-closed-testnet-deployment-preflight-record.mjs
      - run: node --check scripts/prepare-closed-testnet-deployment-preflight-approval.mjs
      - run: node --check scripts/verify-closed-testnet-deployment-preflight.mjs
      - run: node --check scripts/manage-public-testnet-campaign.mjs
      - run: node --check scripts/prepare-public-testnet-attestation.mjs
      - run: node --check scripts/verify-public-testnet-evidence.mjs
      - run: node --check scripts/prepare-deployment-promotion-approval.mjs
      - run: node --check scripts/verify-deployment-promotion.mjs
      - run: forge build --quiet
      - run: node --test tests/closed-testnet-deployment-files.test.mjs tests/closed-testnet-deployment-plan.test.mjs tests/closed-testnet-deployment-preflight.test.mjs
      - run: npm run test:coordinator-evm
      - run: npm run test:evm-outbox-faults
      - run: npm run test:safety-monitor
      - run: npm run test:deployment-rehearsal
      - run: npm run test:escrow-reorg
      - run: npm run test:coordinator-runtime
