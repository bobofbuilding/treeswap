      - run: node --test tests/bit-deployment-observer.test.mjs tests/bit-provider-evidence.test.mjs tests/bit-review-ceremony-preflight.test.mjs tests/bit-independent-review.test.mjs tests/bit-reviewed-manifest.test.mjs
