name: security-and-build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run vercel-build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge test

  lightning-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - run: bash -n infra/regtest/lab.sh
      - run: node --check infra/lightning-adapter/server.mjs
      - run: node --check infra/lightning-adapter/client.mjs
      - run: docker build --file infra/lightning-adapter/Dockerfile --tag treeswap/lightning-adapter:${{ github.sha }} .

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - run: npm ci --ignore-scripts
      - run: npm audit --prefix infra/coordinator/runtime --omit=dev --audit-level=moderate
      - run: node --check lib/coordinator-store.mjs
      - run: node --check lib/coordinator-service-state.mjs
      - run: node --check lib/coordinator-release-supervisor.mjs
      - run: node --check lib/coordinator-recovery-supervisor.mjs
      - run: node --check lib/coordinator-recovery-job.mjs
      - run: node --check lib/coordinator-recovery-action-loop.mjs
      - run: node --check lib/coordinator-recovery-execution-supervisor.mjs
      - run: node --check lib/coordinator-recovery-execution-service.mjs
      - run: node --check lib/coordinator-recovery-operator-policy.mjs
      - run: node --check lib/coordinator-action-runner.mjs
      - run: node --check lib/evm-action-runner.mjs
      - run: node --check lib/deployment-observer.mjs
      - run: node --check lib/deployment-policy.mjs
      - run: node --check lib/deployment-manifest-promotion.mjs
      - run: node --check lib/deployment-promotion-postflight-bundle.mjs
      - run: node --check lib/closed-testnet-deployment-files.mjs
      - run: node --check lib/closed-testnet-deployment-plan.mjs
      - run: node --check lib/closed-testnet-deployment-preflight-observer.mjs
      - run: node --check lib/closed-testnet-deployment-preflight.mjs
      - run: node --check lib/closed-testnet-deployment-postflight-observer.mjs
      - run: node --check lib/closed-testnet-deployment-postflight.mjs
      - run: node --check lib/qualification-evidence.mjs
      - run: node --check lib/local-qualification-verification.mjs
      - run: node --check lib/production-duration-evidence.mjs
      - run: node --check lib/release-authorization.mjs
