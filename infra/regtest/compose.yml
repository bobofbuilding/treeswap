name: treeswap-regtest

x-adapter-policy: &adapter-policy
  MAX_AUTHORIZATION_LIFETIME_SECONDS: "30"
  MAX_CREDENTIAL_AGE_SECONDS: "86400"
  MAX_PAYMENT_SATS: "100000"
  MAX_DAILY_VALUE_SATS: "100000000"
  MAX_IN_FLIGHT_SATS: "150000"
  CAPACITY_EPOCH: "1"
  MAX_PENDING_CHANNELS: "4"
  MINIMUM_ACTIVE_CHANNELS: "1"
  MAX_CHAIN_HEADER_AGE_SECONDS: "3600"
  MAX_CHAIN_NO_PROGRESS_SECONDS: "3600"
  MAX_CHAIN_HEADER_FUTURE_SECONDS: "7200"
  HEALTH_TIMEOUT_MS: "5000"
  DISPATCH_TIMEOUT_MS: "35000"
  MINIMUM_INVOICE_EXPIRY_SECONDS: "300"
  MAXIMUM_INVOICE_EXPIRY_SECONDS: "10800"
  MINIMUM_HOLD_INVOICE_CLTV_BLOCKS: "48"
  MAXIMUM_HOLD_INVOICE_CLTV_BLOCKS: "144"
  FULFILLMENT_SAFETY_BLOCKS: "24"
  MAXIMUM_PAYMENT_TIMEOUT_SECONDS: "30"
  MAXIMUM_ROUTING_FEE_SATS: "10"
  INVOICE_EXPIRY_MARGIN_SECONDS: "60"
  MINIMUM_PAYMENT_CLTV_BLOCKS: "18"
  MINIMUM_INBOUND_RESERVE_SATS: "10000"
  MINIMUM_OUTBOUND_RESERVE_SATS: "10000"
  MAXIMUM_ADVERTISED_INBOUND_SATS: "100000"
  MAXIMUM_ADVERTISED_OUTBOUND_SATS: "100000"
  MAX_CAPACITY_REQUEST_LIFETIME_SECONDS: "30"
  MAX_CAPACITY_OBSERVATION_TTL_SECONDS: "30"
  MAX_CAPACITY_CLOCK_SKEW_SECONDS: "5"

x-adapter-service: &adapter-service
  build:
    context: ../..
    dockerfile: infra/lightning-adapter/Dockerfile
  image: treeswap/lightning-adapter:regtest
  restart: unless-stopped
  profiles: [adapter]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  expose: ["3000"]
  networks: [regtest]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
    interval: 2s
    timeout: 2s
    retries: 30

x-close-collector: &close-collector
  build:
    context: ../..
    dockerfile: infra/lightning-close-collector/Dockerfile
  image: treeswap/lightning-close-collector:regtest
  profiles: [tools]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=8m
  environment:
    LND_REST_URL: https://alice:8080
    LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
    LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
    LND_TLS_CERT_FINGERPRINT: ${ALICE_TLS_FINGERPRINT}
    COLLECTOR_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/signing-private.pem
    LIGHTNING_NODE_COMMITMENT: ${ALICE_CLOSE_NODE_COMMITMENT}
    ATTESTATION_LIFETIME_SECONDS: "30"
    LND_REQUEST_TIMEOUT_MS: "5000"
    MAXIMUM_LND_RESPONSE_BYTES: "1048576"
  networks: [regtest]

services:
  bitcoind:
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    restart: unless-stopped
    environment:
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER}
      BITCOIND_RPC_PASSWORD: ${BITCOIND_RPC_PASSWORD}
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -listen=1
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BITCOIND_RPC_USER}
      - -rpcpassword=${BITCOIND_RPC_PASSWORD}
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=$$BITCOIND_RPC_USER -rpcpassword=$$BITCOIND_RPC_PASSWORD getblockchaininfo >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    networks: [regtest]

  alice:
    image: lightninglabs/lnd:v0.21.2-beta@sha256:17e7e5adf823717a8e1ba7e02ac5d90eb58a029b5d30073914f64ab23e7cebf4
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=${BITCOIND_RPC_USER}
      - --bitcoind.rpcpass=${BITCOIND_RPC_PASSWORD}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=alice
      - --alias=treeswap-alice
      - --color=#3ea34b
    volumes:
      - alice-data:/root/.lnd
    networks: [regtest]

  bob:
    image: lightninglabs/lnd:v0.21.2-beta@sha256:17e7e5adf823717a8e1ba7e02ac5d90eb58a029b5d30073914f64ab23e7cebf4
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=${BITCOIND_RPC_USER}
      - --bitcoind.rpcpass=${BITCOIND_RPC_PASSWORD}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=bob
      - --alias=treeswap-bob
      - --color=#f4a340
    volumes:
      - bob-data:/root/.lnd
    networks: [regtest]

  charlie:
    image: lightninglabs/lnd:v0.21.2-beta@sha256:17e7e5adf823717a8e1ba7e02ac5d90eb58a029b5d30073914f64ab23e7cebf4
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=${BITCOIND_RPC_USER}
      - --bitcoind.rpcpass=${BITCOIND_RPC_PASSWORD}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=charlie
      - --alias=treeswap-charlie-unrouted
      - --color=#888888
    volumes:
      - charlie-data:/root/.lnd
    networks: [regtest]

  export-alice-payer-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp -f /source/tls.cert /target/tls.cert;
        cp -f /source/treeswap/payer.macaroon /target/role.macaroon;
        cp -f /coordinator-public.pem /target/coordinator-public.pem;
        cp -f /capacity-private.pem /target/capacity-private.pem;
        cp -f /response-private.pem /target/response-private.pem;
        chown 1000:1000 /target/tls.cert /target/role.macaroon /target/coordinator-public.pem /target/capacity-private.pem /target/response-private.pem;
        chmod 0400 /target/role.macaroon /target/capacity-private.pem /target/response-private.pem;
        chmod 0444 /target/tls.cert /target/coordinator-public.pem
    volumes:
      - alice-data:/source:ro
      - alice-payer-credentials:/target
      - ${COORDINATOR_PUBLIC_KEY_PATH}:/coordinator-public.pem:ro
      - ${ALICE_CAPACITY_PRIVATE_KEY_PATH}:/capacity-private.pem:ro
      - ${ALICE_RESPONSE_PRIVATE_KEY_PATH}:/response-private.pem:ro
    networks: [regtest]

  export-bob-invoice-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp -f /source/tls.cert /target/tls.cert;
        cp -f /source/treeswap/invoice.macaroon /target/role.macaroon;
        cp -f /coordinator-public.pem /target/coordinator-public.pem;
        cp -f /capacity-private.pem /target/capacity-private.pem;
        cp -f /response-private.pem /target/response-private.pem;
        chown 1000:1000 /target/tls.cert /target/role.macaroon /target/coordinator-public.pem /target/capacity-private.pem /target/response-private.pem;
        chmod 0400 /target/role.macaroon /target/capacity-private.pem /target/response-private.pem;
        chmod 0444 /target/tls.cert /target/coordinator-public.pem
    volumes:
      - bob-data:/source:ro
      - bob-invoice-credentials:/target
      - ${COORDINATOR_PUBLIC_KEY_PATH}:/coordinator-public.pem:ro
      - ${BOB_CAPACITY_PRIVATE_KEY_PATH}:/capacity-private.pem:ro
      - ${BOB_RESPONSE_PRIVATE_KEY_PATH}:/response-private.pem:ro
    networks: [regtest]

  export-bob-invoice-material-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077;
        chown 1000:1000 /target;
        chmod 0700 /target;
        cp -f /source/tls.cert /target/tls.cert;
        cp -f /source/treeswap/invoice-material.macaroon /target/role.macaroon;
        test -s /target/payment-secret.bin || head -c 32 /dev/urandom > /target/payment-secret.bin;
        chown 1000:1000 /target/tls.cert /target/role.macaroon /target/payment-secret.bin;
        chmod 0400 /target/role.macaroon /target/payment-secret.bin;
        chmod 0444 /target/tls.cert
    volumes:
      - bob-data:/source:ro
      - bob-invoice-material-credentials:/target
    networks: [regtest]

  export-selected-solver-invoice-material-provider-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077;
        chown 1000:1000 /target;
        chmod 0700 /target;
        cp -f /provider-private.pem /target/provider-private.pem;
        cp -f /requester-public.pem /target/requester-public.pem;
        cp -f /tls.key /target/tls.key;
        cp -f /tls.cert /target/tls.cert;
        chown 1000:1000 /target/provider-private.pem /target/requester-public.pem /target/tls.key /target/tls.cert;
        chmod 0400 /target/provider-private.pem /target/requester-public.pem /target/tls.key /target/tls.cert
    volumes:
      - selected-solver-invoice-material-provider-credentials:/target
      - ${INVOICE_MATERIAL_PROVIDER_PRIVATE_KEY_PATH}:/provider-private.pem:ro
      - ${INVOICE_MATERIAL_REQUESTER_PUBLIC_KEY_PATH}:/requester-public.pem:ro
      - ${INVOICE_MATERIAL_TLS_PRIVATE_KEY_PATH}:/tls.key:ro
      - ${INVOICE_MATERIAL_TLS_CERTIFICATE_PATH}:/tls.cert:ro
    networks: [regtest]

  export-selected-solver-invoice-material-client-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077;
        chown 1000:1000 /target;
        chmod 0700 /target;
        cp -f /requester-private.pem /target/requester-private.pem;
        cp -f /provider-public.pem /target/provider-public.pem;
        cp -f /tls.cert /target/tls.cert;
        chown 1000:1000 /target/requester-private.pem /target/provider-public.pem /target/tls.cert;
        chmod 0400 /target/requester-private.pem /target/provider-public.pem /target/tls.cert
    volumes:
      - selected-solver-invoice-material-client-credentials:/target
      - ${INVOICE_MATERIAL_REQUESTER_PRIVATE_KEY_PATH}:/requester-private.pem:ro
      - ${INVOICE_MATERIAL_PROVIDER_PUBLIC_KEY_PATH}:/provider-public.pem:ro
      - ${INVOICE_MATERIAL_TLS_CERTIFICATE_PATH}:/tls.cert:ro
    networks: [regtest]

  prepare-selected-solver-invoice-material-state:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown 1000:1000 /provider /client;
        chmod 0700 /provider /client
    volumes:
      - selected-solver-invoice-material-provider-state:/provider
      - selected-solver-invoice-material-client-state:/client
    networks: [regtest]

  export-alice-close-collector-a-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp -f /source/tls.cert /target/tls.cert;
        cp -f /source/treeswap/close-observer-a.macaroon /target/role.macaroon;
        cp -f /signing-private.pem /target/signing-private.pem;
        chown 1000:1000 /target/tls.cert /target/role.macaroon /target/signing-private.pem;
        chmod 0400 /target/role.macaroon /target/signing-private.pem;
        chmod 0444 /target/tls.cert
    volumes:
      - alice-data:/source:ro
      - alice-close-collector-a-credentials:/target
      - ${ALICE_CLOSE_COLLECTOR_A_PRIVATE_KEY_PATH}:/signing-private.pem:ro
    networks: [regtest]

  export-alice-close-collector-b-credential:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp -f /source/tls.cert /target/tls.cert;
        cp -f /source/treeswap/close-observer-b.macaroon /target/role.macaroon;
        cp -f /signing-private.pem /target/signing-private.pem;
        chown 1000:1000 /target/tls.cert /target/role.macaroon /target/signing-private.pem;
        chmod 0400 /target/role.macaroon /target/signing-private.pem;
        chmod 0444 /target/tls.cert
    volumes:
      - alice-data:/source:ro
      - alice-close-collector-b-credentials:/target
      - ${ALICE_CLOSE_COLLECTOR_B_PRIVATE_KEY_PATH}:/signing-private.pem:ro
    networks: [regtest]

  export-coordinator-private-key:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp -f /coordinator-private.pem /target/coordinator-private.pem;
        cp -f /alice-capacity-public.pem /target/alice-capacity-public.pem;
        cp -f /bob-capacity-public.pem /target/bob-capacity-public.pem;
        cp -f /alice-response-public.pem /target/alice-response-public.pem;
        cp -f /bob-response-public.pem /target/bob-response-public.pem;
        chown 1000:1000 /target/coordinator-private.pem /target/alice-capacity-public.pem /target/bob-capacity-public.pem /target/alice-response-public.pem /target/bob-response-public.pem;
        chmod 0400 /target/coordinator-private.pem;
        chmod 0444 /target/alice-capacity-public.pem /target/bob-capacity-public.pem /target/alice-response-public.pem /target/bob-response-public.pem
    volumes:
      - ${COORDINATOR_PRIVATE_KEY_PATH}:/coordinator-private.pem:ro
      - ${ALICE_CAPACITY_PUBLIC_KEY_PATH}:/alice-capacity-public.pem:ro
      - ${BOB_CAPACITY_PUBLIC_KEY_PATH}:/bob-capacity-public.pem:ro
      - ${ALICE_RESPONSE_PUBLIC_KEY_PATH}:/alice-response-public.pem:ro
      - ${BOB_RESPONSE_PUBLIC_KEY_PATH}:/bob-response-public.pem:ro
      - coordinator-credentials:/target
    networks: [regtest]

  payer-adapter:
    <<: *adapter-service
    depends_on:
      alice:
        condition: service_started
    environment:
      <<: *adapter-policy
      ADAPTER_ROLE: payer
      LND_REST_URL: https://alice:8080
      LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${ALICE_TLS_FINGERPRINT}
      COORDINATOR_PUBLIC_KEY_PATH: /run/treeswap/credentials/coordinator-public.pem
      COORDINATOR_KEY_ID: regtest-coordinator-1
      CAPACITY_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/capacity-private.pem
      CAPACITY_SIGNING_KEY_ID: alice-capacity-regtest-1
      RESPONSE_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/response-private.pem
      RESPONSE_SIGNING_KEY_ID: alice-payer-response-regtest-1
      ADAPTER_JOURNAL_PATH: /data/actions.jsonl
      CHAIN_PROGRESS_PATH: /data/chain-progress.json
      CREDENTIAL_ID: alice-payer-regtest
      CREDENTIAL_ROOT_KEY_ID: "103"
      CREDENTIAL_ISSUED_AT: ${ADAPTER_CREDENTIAL_ISSUED_AT}
    volumes:
      - alice-payer-credentials:/run/treeswap/credentials:ro
      - payer-adapter-state:/data

  invoice-adapter:
    <<: *adapter-service
    depends_on:
      bob:
        condition: service_started
    environment:
      <<: *adapter-policy
      ADAPTER_ROLE: invoice
      LND_REST_URL: https://bob:8080
      LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${BOB_TLS_FINGERPRINT}
      COORDINATOR_PUBLIC_KEY_PATH: /run/treeswap/credentials/coordinator-public.pem
      COORDINATOR_KEY_ID: regtest-coordinator-1
      CAPACITY_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/capacity-private.pem
      CAPACITY_SIGNING_KEY_ID: bob-capacity-regtest-1
      RESPONSE_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/response-private.pem
      RESPONSE_SIGNING_KEY_ID: bob-invoice-response-regtest-1
      ADAPTER_JOURNAL_PATH: /data/actions.jsonl
      CHAIN_PROGRESS_PATH: /data/chain-progress.json
      CREDENTIAL_ID: bob-invoice-regtest
      CREDENTIAL_ROOT_KEY_ID: "102"
      CREDENTIAL_ISSUED_AT: ${ADAPTER_CREDENTIAL_ISSUED_AT}
    volumes:
      - bob-invoice-credentials:/run/treeswap/credentials:ro
      - invoice-adapter-state:/data

  lightning-close-collector-a:
    <<: *close-collector
    depends_on:
      alice:
        condition: service_started
    environment:
      LND_REST_URL: https://alice:8080
      LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${ALICE_TLS_FINGERPRINT}
      COLLECTOR_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/signing-private.pem
      LIGHTNING_NODE_COMMITMENT: ${ALICE_CLOSE_NODE_COMMITMENT}
      COLLECTOR_ID: alice-close-a
      ATTESTATION_LIFETIME_SECONDS: "30"
      LND_REQUEST_TIMEOUT_MS: "5000"
      MAXIMUM_LND_RESPONSE_BYTES: "1048576"
    volumes:
      - alice-close-collector-a-credentials:/run/treeswap/credentials:ro

  lightning-close-collector-b:
    <<: *close-collector
    depends_on:
      alice:
        condition: service_started
    environment:
      LND_REST_URL: https://alice:8080
      LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${ALICE_TLS_FINGERPRINT}
      COLLECTOR_SIGNING_PRIVATE_KEY_PATH: /run/treeswap/credentials/signing-private.pem
      LIGHTNING_NODE_COMMITMENT: ${ALICE_CLOSE_NODE_COMMITMENT}
      COLLECTOR_ID: alice-close-b
      ATTESTATION_LIFETIME_SECONDS: "30"
      LND_REQUEST_TIMEOUT_MS: "5000"
      MAXIMUM_LND_RESPONSE_BYTES: "1048576"
    volumes:
      - alice-close-collector-b-credentials:/run/treeswap/credentials:ro

  coordinator-smoke:
    build:
      context: ../..
      dockerfile: infra/coordinator/Dockerfile
    image: treeswap/coordinator:regtest
    command: ["node", "infra/coordinator/smoke.mjs"]
    profiles: [tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      COORDINATOR_PRIVATE_KEY_PATH: /run/treeswap/credentials/coordinator-private.pem
      COORDINATOR_DATABASE_PATH: /data/coordinator.sqlite
      COORDINATOR_KEY_ID: regtest-coordinator-1
      PAYER_ADAPTER_RESPONSE_PUBLIC_KEY_PATH: /run/treeswap/credentials/alice-response-public.pem
      PAYER_ADAPTER_RESPONSE_KEY_ID: alice-payer-response-regtest-1
