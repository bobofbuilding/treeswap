      REQUESTER_PRIVATE_KEY_PATH: /run/treeswap/client/requester-private.pem
      REQUESTER_KEY_ID: selected-solver-provider-regtest-1
      PROVIDER_PUBLIC_KEY_PATH: /run/treeswap/client/provider-public.pem
      PROVIDER_KEY_ID: invoice-material-provider-regtest-1
