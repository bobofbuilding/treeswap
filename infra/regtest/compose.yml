    image: treeswap/selected-solver-invoice-material:regtest
    profiles: [tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    environment:
      LND_REST_URL: https://bob:8080
      LND_MACAROON_PATH: /run/treeswap/credentials/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/credentials/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${BOB_TLS_FINGERPRINT}
      PAYMENT_SECRET_KEY_PATH: /run/treeswap/credentials/payment-secret.bin
    volumes:
      - bob-invoice-material-credentials:/run/treeswap/credentials:ro
    networks: [regtest]

  selected-solver-invoice-material-service:
    build:
      context: ../..
      dockerfile: infra/selected-solver-invoice-material/Dockerfile
    image: treeswap/selected-solver-invoice-material:regtest
    command: ["node", "infra/selected-solver-invoice-material/service.mjs"]
    profiles: [private-service]
    restart: "no"
    depends_on:
      bob:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    environment:
