      COORDINATOR_PRIVATE_KEY_PATH: /run/treeswap/credentials/coordinator-private.pem
      COORDINATOR_DATABASE_PATH: /data/coordinator-invoice.sqlite
      COORDINATOR_KEY_ID: regtest-coordinator-1
      INVOICE_ADAPTER_RESPONSE_PUBLIC_KEY_PATH: /run/treeswap/credentials/bob-response-public.pem
      INVOICE_ADAPTER_RESPONSE_KEY_ID: bob-invoice-response-regtest-1
      PAYMENT_HASH: ${COORDINATOR_SMOKE_PAYMENT_HASH:-pending}
