      PORT: "443"
      PROVIDER_STATE_PATH: /data/provider.sqlite
      PROVIDER_PRIVATE_KEY_PATH: /run/treeswap/provider/provider-private.pem
      REQUESTER_PUBLIC_KEY_PATH: /run/treeswap/provider/requester-public.pem
      TLS_PRIVATE_KEY_PATH: /run/treeswap/provider/tls.key
      TLS_CERTIFICATE_PATH: /run/treeswap/provider/tls.cert
      REQUESTER_KEY_ID: selected-solver-provider-regtest-1
      PROVIDER_KEY_ID: invoice-material-provider-regtest-1
      PAYMENT_SECRET_KEY_ID: selected-solver-payment-secret-regtest-1
      PAYMENT_SECRET_KEY_PATH: /run/treeswap/lnd/payment-secret.bin
      LND_REST_URL: https://bob:8080
      LND_MACAROON_PATH: /run/treeswap/lnd/role.macaroon
      LND_TLS_CERT_PATH: /run/treeswap/lnd/tls.cert
      LND_TLS_CERT_FINGERPRINT: ${BOB_TLS_FINGERPRINT}
      INVOICE_MEMO: treeswap-selected-solver-private-service-regtest
      MAXIMUM_LND_RESPONSE_BYTES: "1048576"
      LND_ADD_TIMEOUT_MS: "5000"
      LND_LOOKUP_TIMEOUT_MS: "5000"
      INVOICE_EXPIRY_SECONDS: "3600"
      INVOICE_CLTV_EXPIRY: "80"
      MAXIMUM_INVOICE_BYTES: "4096"
      MAXIMUM_LIVE_REQUESTS: "64"
      MAXIMUM_REQUEST_BYTES: "16384"
      MAXIMUM_CLOCK_SKEW_SECONDS: "5"
      REQUEST_TIMEOUT_MS: "5000"
      RECOVERY_LEASE_SECONDS: "6"
      RESPONSE_TTL_SECONDS: "30"
    volumes:
